name: Update Supabase DB from CSV

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate SQL from CSV
        run: python3 .github/scripts/import-csv.py

      - name: Apply SQL to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "$SUPABASE_ACCESS_TOKEN" | supabase login
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase sql --file .supabase_update.sql
